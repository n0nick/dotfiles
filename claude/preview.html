<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude — latest responses</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #fbfaf8; --panel: #f4f1ec; --fg: #1c1b19; --muted: #6b6862;
    --rule: #e3e0da; --code-bg: #f2efe9; --accent: #b4551d; --sel: #e9e4db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191817; --panel: #201f1d; --fg: #e8e5df; --muted: #9a958c;
      --rule: #2f2d2a; --code-bg: #232120; --accent: #e0803f; --sel: #2b2926;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #side {
    width: 248px; flex: none; background: var(--panel);
    border-right: 1px solid var(--rule); overflow-y: auto;
  }
  #side h1 {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 0; padding: 1rem 1rem .5rem;
  }
  .s {
    display: block; width: 100%; text-align: left; background: none;
    border: 0; border-bottom: 1px solid var(--rule); padding: .6rem 1rem;
    font: inherit; color: inherit; cursor: pointer; position: relative;
  }
  .s:hover { background: var(--sel); }
  .s.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
  .s .nm { font-size: 13.5px; font-weight: 600; padding-right: .8rem; }
  .s .meta { font-size: 11.5px; color: var(--muted); margin-top: .1rem; }
  .s .unread {
    position: absolute; right: .8rem; top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
  }
  #empty { padding: 1rem; font-size: 13px; color: var(--muted); line-height: 1.5; }

  #wrap { flex: 1; overflow-y: auto; }
  #bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: baseline;
    gap: .6rem; padding: .55rem 1.4rem; background: var(--bg);
    border-bottom: 1px solid var(--rule); font-size: 12.5px; color: var(--muted);
  }
  #bar b { color: var(--fg); font-weight: 600; font-size: 13.5px; }
  #nav {
    margin-left: auto; display: inline-flex; align-items: center; gap: .3rem;
  }
  #acts { display: inline-flex; align-items: center; gap: .3rem; margin-left: .5rem; }
  #acts:not(.ready) { display: none; }
  #nav button, #acts button {
    background: none; border: 1px solid var(--rule); border-radius: 5px;
    color: var(--fg); font: inherit; font-size: 13px; line-height: 1;
    padding: .15rem .45rem; cursor: pointer;
  }
  #nav button:hover:not(:disabled), #acts button:hover { background: var(--sel); }
  #nav button:disabled { opacity: .35; cursor: default; }
  #copy { min-width: 3.6em; }
  #copy.done { border-color: var(--accent); color: var(--accent); }
  #pos { font-variant-numeric: tabular-nums; min-width: 4.2em; text-align: center; }
  #new {
    margin-left: .6rem; align-self: center; background: var(--fg); color: var(--bg);
    border: 0; border-radius: 999px; padding: .25rem .7rem;
    font: inherit; font-size: 11.5px; cursor: pointer; visibility: hidden;
  }
  main { max-width: 74ch; margin: 0 auto; padding: 2.2rem 1.6rem 6rem; }
  main > :first-child { margin-top: 0; }
  h1, h2, h3 { line-height: 1.25; margin: 1.9em 0 .6em; }
  main h1 { font-size: 1.6rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; }
  p, li { overflow-wrap: break-word; }
  a { color: var(--accent); }
  code {
    background: var(--code-bg); padding: .12em .35em; border-radius: 4px;
    font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  pre {
    background: var(--code-bg); padding: .9rem 1rem; border-radius: 8px;
    overflow-x: auto; border: 1px solid var(--rule);
  }
  pre code { background: none; padding: 0; }
  blockquote {
    margin: 1.2em 0; padding: .1em 0 .1em 1rem;
    border-left: 3px solid var(--rule); color: var(--muted);
  }
  blockquote.prompt {
    margin: 0 0 2em; padding: .9rem 1.1rem; border-left: 3px solid var(--accent);
    background: var(--panel); border-radius: 0 6px 6px 0; color: var(--fg);
    font-size: 15px;
  }
  blockquote.prompt > :first-child { margin-top: 0; }
  blockquote.prompt > :last-child { margin-bottom: 0; }
  blockquote.prompt blockquote { color: var(--muted); font-size: 14.5px; }
  table {
    border-collapse: collapse; width: 100%; margin: 1.3em 0;
    font-size: 14.5px; display: block; overflow-x: auto;
  }
  th, td { border: 1px solid var(--rule); padding: .45rem .7rem; text-align: left; }
  th { background: var(--code-bg); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2em 0; }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    #side { width: 100%; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--rule); }
  }
</style>
</head>
<body>
  <nav id="side">
    <h1>Sessions</h1>
    <div id="list"></div>
    <div id="empty" hidden>Nothing yet. A session appears here once it finishes a response.</div>
  </nav>

  <div id="wrap">
    <div id="bar">
      <b id="title">—</b><span id="sub"></span>
      <span id="nav" hidden>
        <button id="prev" title="Older (←)">‹</button>
        <span id="pos"></span>
        <button id="next" title="Newer (→)">›</button>
      </span>
      <span id="acts">
        <button id="copy" title="Copy this response as markdown (c)">copy</button>
        <button id="dl" title="Download this response as .md">↓</button>
      </span>
      <button id="new">new response ↑</button>
    </div>
    <main id="out"></main>
  </div>

<script>
  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');
  const outEl   = document.getElementById('out');
  const titleEl = document.getElementById('title');
  const subEl   = document.getElementById('sub');
  const navEl   = document.getElementById('nav');
  const posEl   = document.getElementById('pos');
  const prevEl  = document.getElementById('prev');
  const nextEl  = document.getElementById('next');
  const pill    = document.getElementById('new');
  const wrap    = document.getElementById('wrap');

  const sessions = new Map();   // file -> {name, project, updated, turns, lm, unread}
  const at       = new Map();   // file -> index into turns; 0 is the newest
  let pinned = null;            // a session you clicked; null follows the newest

  // Front matter values are JSON-encoded by the hook, so names containing
  // quotes or colons survive intact.
  function parse(text) {
    const m = text.match(/^---\n([\s\S]*?)\n---\n?/);
    const meta = {};
    let body = text;
    if (m) {
      body = text.slice(m[0].length);
      for (const line of m[1].split('\n')) {
        const i = line.indexOf(': ');
        if (i < 0) continue;
        try { meta[line.slice(0, i)] = JSON.parse(line.slice(i + 2)); } catch {}
      }
    }
    return {
      name: meta.name || null,
      project: meta.project || '',
      updated: meta.updated ? new Date(meta.updated) : null,
      // The separators are declared per file, not fixed: a message that quotes
      // a fixed one would split itself in half here.
      psep: meta.psep || '<!--prompt-->',
      turns: body.split(meta.sep || '<!--turn-->').map(t => t.trim()).filter(Boolean),
    };
  }

  const ago = d => {
    if (!d) return '';
    const s = Math.round((Date.now() - d) / 1000);
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    const h = Math.round(s / 3600);
    return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
  };

  const shortPath = p => p ? p.split('/').filter(Boolean).slice(-2).join('/') : '';
  const ordered = () => [...sessions.entries()].sort((a, b) => b[1].updated - a[1].updated);
  const active  = () => (pinned && sessions.has(pinned)) ? pinned
                      : (ordered()[0] || [null])[0];
  const index   = f => Math.min(at.get(f) ?? 0, Math.max(0, (sessions.get(f)?.turns.length ?? 1) - 1));

  // Older is a higher index, since turns are stored newest-first.
  function step(delta) {
    const cur = active();
    if (!cur) return;
    const s = sessions.get(cur);
    const next = Math.min(Math.max(index(cur) + delta, 0), s.turns.length - 1);
    if (next === index(cur)) return;
    at.set(cur, next);
    if (next === 0) pill.style.visibility = 'hidden';
    render(true);
  }

  prevEl.onclick = () => step(+1);
  nextEl.onclick = () => step(-1);
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); step(+1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); step(-1); }
    if (e.key === 'c') { e.preventDefault(); copyMd(); }
  });

  pill.onclick = () => {
    const cur = active();
    if (cur) at.set(cur, 0);
    pill.style.visibility = 'hidden';
    render(true);
    wrap.scrollTo({ top: 0, behavior: 'smooth' });
  };

  let shown = { file: null, text: null };
  // What the copy/download buttons act on: the response alone, matching what
  // `preview` writes to a file. Your own message is not included — it is your
  // words, and re-quoting it is what mangled the rendering earlier.
  let onScreen = { md: '', filename: 'response.md' };

  const copyEl = document.getElementById('copy');
  const dlEl   = document.getElementById('dl');
  const actsEl = document.getElementById('acts');

  async function copyMd() {
    if (!onScreen.md) return;
    try {
      await navigator.clipboard.writeText(onScreen.md);
    } catch {
      // Clipboard API needs a secure context; 127.0.0.1 counts, but fall back
      // rather than fail silently if permission is refused.
      const ta = document.createElement('textarea');
      ta.value = onScreen.md;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.append(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    copyEl.textContent = 'copied';
    copyEl.classList.add('done');
    setTimeout(() => { copyEl.textContent = 'copy'; copyEl.classList.remove('done'); }, 1200);
  }

  function downloadMd() {
    if (!onScreen.md) return;
    const url = URL.createObjectURL(new Blob([onScreen.md], { type: 'text/markdown' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = onScreen.filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  copyEl.onclick = copyMd;
  dlEl.onclick = downloadMd;

  function draw() {
    const cur = active(), rows = ordered();
    emptyEl.hidden = rows.length > 0;

    listEl.textContent = '';
    for (const [file, s] of rows) {
      const b = document.createElement('button');
      b.className = 's' + (file === cur ? ' on' : '');
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = s.name || file.replace(/\.md$/, '').slice(0, 8);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = [shortPath(s.project), ago(s.updated)].filter(Boolean).join(' · ');
      b.append(nm, meta);
      if (s.unread && file !== cur) {
        const d = document.createElement('span');
        d.className = 'unread';
        b.append(d);
      }
      b.onclick = () => { pinned = file; s.unread = false; render(true); };
      listEl.append(b);
    }

    if (!cur) { titleEl.textContent = '—'; subEl.textContent = ''; navEl.hidden = true; return; }
    const s = sessions.get(cur), i = index(cur);
    titleEl.textContent = s.name || cur.slice(0, 8);
    subEl.textContent = [s.project, ago(s.updated)].filter(Boolean).join(' · ');

    navEl.hidden = s.turns.length < 2;
    posEl.textContent = `${i + 1} / ${s.turns.length}`;
    prevEl.disabled = i >= s.turns.length - 1;
    nextEl.disabled = i <= 0;
  }

  function render(force) {
    const cur = active();
    draw();
    if (!cur) { outEl.textContent = ''; shown = { file: null, text: null }; return; }

    const text = sessions.get(cur).turns[index(cur)] ?? '';
    if (!force && shown.file === cur && shown.text === text) return;

    shown = { file: cur, text };

    // Your message renders into its own container rather than as quoted
    // markdown: it often contains blockquotes of its own, and re-quoting it
    // collapses the whole thing into one paragraph.
    const i = text.indexOf(sessions.get(cur).psep);
    const prompt = i < 0 ? '' : text.slice(0, i).trim();
    const answer = i < 0 ? text : text.slice(i + sessions.get(cur).psep.length).trim();
    outEl.innerHTML =
      (prompt ? `<blockquote class="prompt">${marked.parse(prompt)}</blockquote>` : '') +
      marked.parse(answer);
    sessions.get(cur).unread = false;

    const slug = (sessions.get(cur).name || 'response')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'response';
    onScreen = { md: answer, filename: `${slug}-${index(cur) + 1}.md` };
    actsEl.classList.toggle('ready', !!answer);

    // Reaching here means the rendered text changed, so go to the top: a
    // response you have not read starts at its beginning.
    wrap.scrollTo({ top: 0 });
  }

  // The static server sends no Cache-Control, so a browser is free to keep
  // serving a stale copy of this page against freshly written files — which
  // renders as subtly wrong output rather than an error. Reload when the page
  // itself changes.
  let pageLm = null;
  async function watchSelf() {
    try {
      const h = await fetch('index.html', { method: 'HEAD', cache: 'no-store' });
      const lm = h.headers.get('Last-Modified');
      if (pageLm && lm && lm !== pageLm) location.reload();
      pageLm = lm;
    } catch { /* ignore */ }
  }

  async function poll() {
    watchSelf();
    try {
      const idx  = await fetch('sessions/', { cache: 'no-store' });
      const doc  = new DOMParser().parseFromString(await idx.text(), 'text/html');
      const files = [...doc.querySelectorAll('a[href]')]
        .map(a => a.getAttribute('href'))
        .filter(h => h.endsWith('.md'));

      for (const f of files) {
        // HEAD first: bodies carry ten turns each, and almost every tick is a
        // no-op.
        const h = await fetch('sessions/' + f, { method: 'HEAD', cache: 'no-store' });
        if (!h.ok) continue;
        const lm = h.headers.get('Last-Modified');
        const prev = sessions.get(f);
        if (prev && prev.lm === lm) continue;

        const r = await fetch('sessions/' + f, { cache: 'no-store' });
        if (!r.ok) continue;
        const next = { ...parse(await r.text()), lm };

        if (!prev) {
          sessions.set(f, { ...next, unread: false });
        } else {
          const wasNewest = index(f) === 0;
          const changed = prev.turns[0] !== next.turns[0];
          Object.assign(prev, next, { unread: prev.unread || (changed && f !== active()) });
          // Reading an older turn when a new one lands: hold your place and
          // offer the jump instead of taking it.
          if (changed && f === active() && !wasNewest) pill.style.visibility = 'visible';
          if (wasNewest) at.set(f, 0);
        }
      }
      for (const f of [...sessions.keys()]) if (!files.includes(f)) { sessions.delete(f); at.delete(f); }
    } catch { /* server down — keep showing what we have */ }
    render(false);
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
